name: Build ProShitje Licensing Starter
on: {workflow_dispatch: {}, push: {branches: [main, master]}}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: msbuild ProShitjeLicensing.csproj /p:Configuration=Release /p:Platform=AnyCPU /m /v:minimal
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path bin/Release/* -DestinationPath ProShitjeLicensing-Release.zip -Force
      - uses: actions/upload-artifact@v4
        with: {name: ProShitjeLicensing-Release, path: ProShitjeLicensing-Release.zip}
