name: Build ProShitje 1.3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet assets
        shell: pwsh
        run: dotnet restore .\ProShitje13.csproj --force --verbosity minimal

      - name: Verify assets file
        shell: pwsh
        run: |
          if (!(Test-Path .\obj\project.assets.json)) {
            Write-Error "NuGet restore nuk krijoi obj/project.assets.json"
            exit 1
          }

      - name: Build ProShitje x86
        run: msbuild .\ProShitje13.csproj /restore /p:Configuration=Release /p:PlatformTarget=x86 /m

      - name: Package EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item .\bin\Release\net48\* .\package\ -Recurse -Force
          Compress-Archive -Path .\package\* -DestinationPath .\ProShitje13-Windows-x86.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProShitje13-Windows-x86
          path: ProShitje13-Windows-x86.zip
