name: Build ProShitje 1.3
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build x86
        run: msbuild .\ProShitje13.csproj /p:Configuration=Release /p:PlatformTarget=x86 /m
      - name: Package EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item .\bin\Release\net48\* .\package\ -Recurse -Force
          Compress-Archive -Path .\package\* -DestinationPath .\ProShitje13-Windows-x86.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ProShitje13-Windows-x86
          path: ProShitje13-Windows-x86.zip
